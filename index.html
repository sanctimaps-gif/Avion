<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1a33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Airport Manager</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1a33'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  </head>
  <body style="margin:0;background:#0a1a33;color:#eaf3ff;font-family:system-ui,sans-serif">
    <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center">
      <div style="font-size:48px">✈️</div>
      <div style="font-size:20px;font-weight:700">Airport Manager</div>
      <div id="boot-msg" style="opacity:.8;max-width:420px">Chargement…<br /><small>Si cet écran reste affiché, ouvrez ce fichier dans Safari ou Chrome (l'aperçu de fichiers ne lance pas les jeux).</small></div>
    </div>
    <script>
      // Affiche toute erreur de démarrage au lieu d'un écran blanc.
      window.addEventListener('error', function (e) {
        var m = document.getElementById('boot-msg');
        if (m) m.innerHTML = 'Erreur au démarrage : ' + (e.message || e) + '<br><small>' + navigator.userAgent + '</small>';
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
