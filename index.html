  <body style="margin:0;background:#0a1a33;color:#eaf3ff;font-family:system-ui,sans-serif">
    <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center">
      <div style="font-size:48px">✈️</div>
      <div style="font-size:20px;font-weight:700">Airport Manager</div>
      <div id="boot-msg" style="opacity:.8;max-width:420px">Chargement…<br /><small>Si cet écran reste affiché, ouvrez ce fichier dans Safari ou Chrome (l'aperçu de fichiers ne lance pas les jeux).</small></div>
    </div>
    <script>
      // Affiche toute erreur de démarrage au lieu d'un écran blanc.
      window.addEventListener('error', function (e) {
        var m = document.getElementById('boot-msg');
        if (m) m.innerHTML = 'Erreur au démarrage : ' + (e.message || e) + '<br><small>' + navigator.userAgent + '</small>';
      });
      setTimeout(function () {
        var m = document.getElementById('boot-msg');
        if (m && document.getElementById('boot')) m.innerHTML = 'Le jeu ne parvient pas à démarrer.<br><small>Rechargez la page. Si le problème continue, envoyez une capture de cet écran.<br>' + navigator.userAgent + '</small>';
      }, 10000);
    </script>
  </body>
